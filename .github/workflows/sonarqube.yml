name: SonarQube

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://infrastructure.projectonline.digital.gea.com/
        with:
          args: >
            -Dsonar.projectKey=terraform-provider-aikido
            -Dsonar.sources=.
